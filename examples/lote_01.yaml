# Lote canonico — fixture executavel em P1 (rota blocky, sem GPU)
# Valida contra schemas/spec.v1.schema.json. E a fixture usada pelos testes de invariante.
schema: forge3d/spec@1

projeto: demo
perfil: godot4
# destino sempre dentro do sandbox do proprio Forge3D (deny by default)
destino_exportacao: ~/.local/state/forge3d/saida/lote_01
estilo_global: blocky_voxel

paleta:
  - "#0d0d0f"
  - "#3a3a40"
  - "#ff5a1f"
  - "#ffd166"
  - "#c9a227"

politica:
  falha: continuar
  custo_max_min: 30
  seed_base: 20261110

lote:
  - id: weapon.sword.fire.01
    tipo: prop_equipavel
    rota: blocky
    prompt: >-
      Espada larga de ferro negro com runas de lava brilhantes na lamina,
      cabo envolto em couro gasto e pomo de bronze.
    altura_metros: 1.10
    pivot: empunhadura
    limite_triangulos: 800
    material: opaque
    colisao: convex
    # GAP-013: 36 tris — um LOD de 50% perde a guarda (IoU 0,55 no lado, medido)
    lod: [100]
    tags: [weapon, sword, fire]

  - id: prop.potion.heal.01
    tipo: prop_estatico
    rota: blocky
    prompt: >-
      Frasco de pocao de vida com liquido vermelho luminoso, tampa de cortica
      e rotulo de pergaminho.
    altura_metros: 0.18
    pivot: base
    limite_triangulos: 300
    colisao: box
    lod: [100]
    tags: [consumivel, potion]

  - id: mob.skeleton.guard
    tipo: personagem_humanoide
    rota: blocky
    prompt: >-
      Esqueleto guerreiro com elmo rachado de bronze, peitoral de couro escuro
      e escudo pequeno no braco esquerdo.
    altura_metros: 1.85
    pivot: base
    limite_triangulos: 3000
    auto_rig: true
    esqueleto: godot-humanoid@1
    colisao: convex
    # GAP-013: 300 tris nao comportam LOD (a 50% some o antebraco); LOD fica para mesh
    lod: [100]
    tags: [mob, undead, guard]
    # animacoes_base: [idle, walk]   # reservado (D14): gera FORGE-W-ANIM, nao erro

