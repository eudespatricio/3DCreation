# Dungeon modular — portao da P4: grade 5x2 (10 setores), catalogo de 7 modulos (D74/D75/D77)
# Foco: WFC com seed, colisao por peca (ucx, hull por caixa) e 1 draw call por setor.
schema: forge3d/spec@3

projeto: demo
perfil: godot4
destino_exportacao: ~/.local/state/forge3d/saida/modular
estilo_global: lowpoly_lit

paleta:
  - "#7d858f"   # chapa clara — paredes
  - "#3b4048"   # chapa escura — bordas
  - "#1d2024"   # junta — piso

politica:
  falha: continuar
  custo_max_min: 10
  seed_base: 20261111

lote:
  - id: dungeon.setor.x0y0
    tipo: mapa_setor
    rota: modular
    prompt: >-
      Setor (0,0) da dungeon modular 5x2; o modulo e escolhido pelo layout da seed.
    modular:
      grade: [5, 2]
      modulos: [reto_ns, reto_lo, curva_ne, curva_no, tres_bocas, quatro_bocas, beco]
      setor: [0, 0]
    colisao: ucx    # hull por caixa: piso, placa e paredes viram colisores separados
    tags: [dungeon, setor, modular]

  - id: dungeon.setor.x1y0
