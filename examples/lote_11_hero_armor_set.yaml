# Lote de referencia v4: Hero base + set completo de armadura modular (6 pecas + escudo)
schema: forge3d/spec@4

projeto: demo
perfil: godot4
destino_exportacao: ~/.local/state/forge3d/saida/lote_11_hero_armor
estilo_global: stylized_pbr
paleta:
  - "#2C303A"
  - "#C59B27"
  - "#8B1E24"
  - "#D8CFC4"

politica:
  falha: continuar
  custo_max_min: 120
  seed_base: 20261113

lote:
  - id: hero.paladin.base
    tipo: personagem_humanoide
    rota: mesh
    template_humanoide: true
    qualidade: hero
    prompt: >-
      Medieval paladin hero in silver and gold trimmed plate tunic, neutral A-pose,
      clean proportions, game-ready silhouette.
    altura_metros: 1.80
    pivot: base
    limite_triangulos: 12000
    material: pbr
    colisao: convex
    auto_rig: true
    esqueleto: godot-humanoid@1
    animacoes_base: [idle, walk, run, jump, attack, block, hit, death]
    seed: 20261113
    lod: [100, 50]
    tags: [hero, armor, modular]

  - id: armor.paladin.helm
    tipo: prop_equipavel
    rota: mesh
    parte: elmo
    skinned: false
    prompt: Full medieval knight helm with gold visor trim
    altura_metros: 0.30
    pivot: origem
    limite_triangulos: 1800
    material: pbr
    colisao: none
    seed: 20261114
    tags: [armor, helm]

  - id: armor.paladin.pauldrons
    tipo: prop_equipavel
    rota: mesh
    parte: ombreiras
    skinned: true
    prompt: Symmetric medieval paladin shoulder pauldrons in brushed steel and gold
