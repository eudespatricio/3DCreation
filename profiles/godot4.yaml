# Perfil de export — Godot 4
# Consumido por forge3d (P1). Nao e codigo: mudar aqui muda o QC, nada mais.
schema: forge3d/profile@1
perfil: godot4
versao: 1

formato: [glb]

unidades:
  escala_saida: 1.0              # D62: sem conversao; o glb sai na unidade da geracao
  metros_por_unidade: 1.0        # 1 unidade glTF = 1 m, casa com Node3D

eixos:
  up: "+Y"
  frente: "-Z"

aplicar_transforms: true

pivot:
  prop_estatico: base
  prop_equipavel: empunhadura
  personagem_humanoide: base
  criatura: base
  modulo_cenario: base
  mapa_setor: centro

colisao:
  modo: convex_hull_por_peca
  prefixo: "UCX_"
  max_partes: 8
  dentro_da_aabb: true

lod:
  sufixos: ["_LOD0", "_LOD1", "_LOD2"]
  preservar_materiais: true
  distancia_m: 25.0

rig:
  esqueleto_padrao: "godot-humanoid@1"
  max_ossos: 64
  # D66: retarget da animacao base — osso semantico -> nome do osso neste esqueleto.
  # O mesmo clipe e materializado nos dois esqueletos por esta tabela, nunca por nome igual.
  retarget:
    "godot-humanoid@1":
      quadril: Hips
      tronco: Chest
      coluna: Spine1
      cabeca: Head
      ombro_e: Shoulder.L
      ombro_d: Shoulder.R
      braco_e: UpperArm.L
      braco_d: UpperArm.R
      antebraco_e: LowerArm.L
      antebraco_d: LowerArm.R
      perna_e: UpperLeg.L
      perna_d: UpperLeg.R
      canela_e: LowerLeg.L
      canela_d: LowerLeg.R
      pe_e: Foot.L
      pe_d: Foot.R
  mapas:
    "godot-humanoid@1":
      - Root
      - Hips
      - Spine
      - Spine1
      - Chest
      - Neck
      - Head
      - Shoulder.L
      - UpperArm.L
      - LowerArm.L
      - Hand.L
      - Shoulder.R
      - UpperArm.R
      - LowerArm.R
      - Hand.R
      - UpperLeg.L
      - LowerLeg.L
      - Foot.L
      - Toe.L
      - UpperLeg.R
      - LowerLeg.R
      - Foot.R
      - Toe.R

material:
  modelo: metallic-roughness
  textura_max: 1024
  pot: true
  filtro: nearest                # [verificar] U3: glTF nao forca filtro; depende do preset de import

validacao:
  escala_delta_pct: 0.5
  pivo_delta_mm: 1.0
  materiais_max: 8
  bytes_max_kb: 2048
  nao_manifold_max: 0
  faces_degeneradas_max: 0

orcamento_triangulos:
  prop_estatico: 1500
  prop_equipavel: 800
  personagem_humanoide: 6000
  criatura: 6000
  modulo_cenario: 2000
  mapa_setor: 20000
