# Perfil de export — Godot 4
# Consumido por forge3d (P1). Nao e codigo: mudar aqui muda o QC, nada mais.
schema: forge3d/profile@1
perfil: godot4
versao: 1

formato: [glb]

unidades:
  escala_saida: 1.0              # D62: sem conversao; o glb sai na unidade da geracao
  metros_por_unidade: 1.0        # 1 unidade glTF = 1 m, casa com Node3D

eixos:
  up: "+Y"
  frente: "-Z"

aplicar_transforms: true

pivot:
  prop_estatico: base
  prop_equipavel: empunhadura
  personagem_humanoide: base
  criatura: base
  criatura_quadrupede: base
  criatura_alada: base
  montaria: base
  modulo_cenario: base
  mapa_setor: centro

colisao:
  modo: convex_hull_por_peca
  prefixo: "UCX_"
  max_partes: 8
  dentro_da_aabb: true

lod:
  sufixos: ["_LOD0", "_LOD1", "_LOD2"]
  preservar_materiais: true
  distancia_m: 25.0

rig:
  esqueleto_padrao: "godot-humanoid@1"
  max_ossos: 64
  # D66: retarget da animacao base — osso semantico -> nome do osso neste esqueleto.
  # O mesmo clipe e materializado nos dois esqueletos por esta tabela, nunca por nome igual.
  retarget:
    "godot-humanoid@1":
      quadril: Hips
      tronco: Chest
      coluna: Spine1
      cabeca: Head
      ombro_e: Shoulder.L
      ombro_d: Shoulder.R
      braco_e: UpperArm.L
      braco_d: UpperArm.R
      antebraco_e: LowerArm.L
      antebraco_d: LowerArm.R
      perna_e: UpperLeg.L
      perna_d: UpperLeg.R
      canela_e: LowerLeg.L
      canela_d: LowerLeg.R
      pe_e: Foot.L
      pe_d: Foot.R
    "quadruped@1":
      quadril: Hips
      coluna: Spine
      tronco: Chest
      pescoco: Neck
      cabeca: Head
      mandibula: Jaw
      cauda_1: Tail1
      cauda_2: Tail2
      cauda_3: Tail3
      pata_dianteira_e: FrontUpperLeg.L
      canela_dianteira_e: FrontLowerLeg.L
      pe_dianteiro_e: FrontFoot.L
      pata_dianteira_d: FrontUpperLeg.R
      canela_dianteira_d: FrontLowerLeg.R
      pe_dianteiro_d: FrontFoot.R
      pata_traseira_e: BackUpperLeg.L
      canela_traseira_e: BackLowerLeg.L
      pe_traseiro_e: BackFoot.L
      pata_traseira_d: BackUpperLeg.R
      canela_traseira_d: BackLowerLeg.R
      pe_traseiro_d: BackFoot.R
      sela: MountSeat
    "winged_mount@1":
      quadril: Hips
      coluna: Spine
      tronco: Chest
      pescoco: Neck
      cabeca: Head
      mandibula: Jaw
      cauda_1: Tail1
      cauda_2: Tail2
      cauda_3: Tail3
      pata_dianteira_e: FrontUpperLeg.L
      canela_dianteira_e: FrontLowerLeg.L
      pe_dianteiro_e: FrontFoot.L
      pata_dianteira_d: FrontUpperLeg.R
      canela_dianteira_d: FrontLowerLeg.R
      pe_dianteiro_d: FrontFoot.R
      pata_traseira_e: BackUpperLeg.L
      canela_traseira_e: BackLowerLeg.L
      pe_traseiro_e: BackFoot.L
      pata_traseira_d: BackUpperLeg.R
      canela_traseira_d: BackLowerLeg.R
      pe_traseiro_d: BackFoot.R
      asa_ombro_e: WingShoulder.L
      asa_braco_e: WingArm.L
      asa_antebraco_e: WingForearm.L
      asa_ponta_e: WingTip.L
      asa_ombro_d: WingShoulder.R
      asa_braco_d: WingArm.R
      asa_antebraco_d: WingForearm.R
      asa_ponta_d: WingTip.R
      sela: MountSeat
  mapas:
    "godot-humanoid@1":
      - Root
      - Hips
      - Spine
      - Spine1
      - Chest
      - Neck
      - Head
      - Shoulder.L
      - UpperArm.L
      - LowerArm.L
      - Hand.L
      - Shoulder.R
      - UpperArm.R
      - LowerArm.R
      - Hand.R
      - UpperLeg.L
      - LowerLeg.L
      - Foot.L
      - Toe.L
      - UpperLeg.R
      - LowerLeg.R
      - Foot.R
      - Toe.R
    "quadruped@1":
      - Root
      - Hips
      - Spine
      - Chest
      - Neck
      - Head
      - Jaw
      - Tail1
      - Tail2
      - Tail3
      - FrontUpperLeg.L
      - FrontLowerLeg.L
      - FrontFoot.L
      - FrontUpperLeg.R
      - FrontLowerLeg.R
      - FrontFoot.R
      - BackUpperLeg.L
      - BackLowerLeg.L
      - BackFoot.L
      - BackUpperLeg.R
      - BackLowerLeg.R
      - BackFoot.R
      - MountSeat
    "winged_mount@1":
      - Root
      - Hips
      - Spine
      - Chest
      - Neck
      - Head
      - Jaw
      - Tail1
      - Tail2
      - Tail3
      - FrontUpperLeg.L
      - FrontLowerLeg.L
      - FrontFoot.L
      - FrontUpperLeg.R
      - FrontLowerLeg.R
      - FrontFoot.R
      - BackUpperLeg.L
      - BackLowerLeg.L
      - BackFoot.L
      - BackUpperLeg.R
      - BackLowerLeg.R
      - BackFoot.R
      - WingShoulder.L
      - WingArm.L
      - WingForearm.L
      - WingTip.L
      - WingShoulder.R
      - WingArm.R
      - WingForearm.R
      - WingTip.R
      - MountSeat

material:
  modelo: metallic-roughness
  textura_max: 1024
  pot: true
  filtro: nearest                # [verificar] U3: glTF nao forca filtro; depende do preset de import

validacao:
  escala_delta_pct: 0.5
  pivo_delta_mm: 1.0
  materiais_max: 8
  bytes_max_kb: 2048
  nao_manifold_max: 0
  faces_degeneradas_max: 0

orcamento_triangulos:
  prop_estatico: 1500
  prop_equipavel: 800
  personagem_humanoide: 6000
  criatura: 6000
  modulo_cenario: 2000
  mapa_setor: 20000
