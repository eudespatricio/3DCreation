# Perfil de export — Roblox (R15 / Retrocompativel v3 · Calibrado ate 80% AA)
# Evolui o perfil roblox-r15 v2 preservando spec@1..@5, destravando Hero/Ultra
# e removendo o gargalo legado de 1500 tris em props e 4096 KB em bakes PBR.
schema: forge3d/profile@1
perfil: roblox-r15
versao: 3

formato: [glb, rbxlx, rbxmx]

unidades:
  escala_saida: 3.5714
  metros_por_unidade: 0.28
  metros_por_stud: 0.28
  arredondar_studs: 0.001

eixos:
  up: "+Y"
  frente: "-Z"

aplicar_transforms: true

pivot:
  prop_estatico: base
  prop_equipavel: empunhadura
  personagem_humanoide: base
  criatura: base
  criatura_quadrupede: base
  criatura_alada: base
  montaria: base
  modulo_cenario: base
  mapa_setor: centro

colisao:
  modo: hull_por_parte
  max_partes: 15
  uma_por_parte: true

lod:
  habilitado: false

rig:
  esqueleto_padrao: "r15@1"
  max_ossos: 24
  raiz: HumanoidRootPart
  postura:
    modo_rest: natural_relaxada
    angulo_braco_graus: 14.0
    fix_silhouette: false
    variacao_seed: true
  retarget:
    "r15@1":
      quadril: LowerTorso
      tronco: UpperTorso
      coluna: UpperTorso
      cabeca: Head
      ombro_e: LeftUpperArm
      ombro_d: RightUpperArm
      braco_e: LeftUpperArm
      braco_d: RightUpperArm
      antebraco_e: LeftLowerArm
      antebraco_d: RightLowerArm
      perna_e: LeftUpperLeg
      perna_d: RightUpperLeg
      canela_e: LeftLowerLeg
      canela_d: RightLowerLeg
      pe_e: LeftFoot
      pe_d: RightFoot
  mapas:
    "r15@1":
      - HumanoidRootPart
      - Head
      - UpperTorso
      - LowerTorso
      - LeftUpperArm
      - LeftLowerArm
      - LeftHand
      - RightUpperArm
      - RightLowerArm
      - RightHand
      - LeftUpperLeg
      - LeftLowerLeg
      - LeftFoot
      - RightUpperLeg
      - RightLowerLeg
      - RightFoot

material:
  modelo: surface_appearance
  textura_max: 2048
  normal_max: 1024
  normal_max_ultra: 2048
  canais_pbr: [ColorMap, NormalMap, RoughnessMap, MetalnessMap]
  espaco_normal: opengl_pos_y
  exigir_tangents: true
  pot: true
  filtro: linear

validacao:
  escala_delta_pct: 1.0
  pivo_delta_mm: 2.0
  materiais_max: 1
  bytes_max_kb: 16384            # evita downscale para 256/128px quando ha mapas PBR 1k/2k
  nao_manifold_max: 0
  faces_degeneradas_max: 0
  partes_max: 15
  triangulos_por_parte_max: 16000
  triangulos_por_parte_max_ultra: 18000

orcamento_triangulos:
  prop_estatico: 4500
  prop_equipavel: 2000
  personagem_humanoide: 8000
  criatura: 8000
  criatura_quadrupede: 8000
  criatura_alada: 10000
  montaria: 8000
  modulo_cenario: 7000
  mapa_setor: 35000

orcamento_triangulos_hero:
  prop_estatico: 10000
  prop_equipavel: 3500
  personagem_humanoide: 14000
  criatura: 14000
  criatura_quadrupede: 14000
  criatura_alada: 15000
  montaria: 14000
  modulo_cenario: 14000
  mapa_setor: 80000

orcamento_triangulos_ultra:
  prop_estatico: 16000
  prop_equipavel: 4000
  personagem_humanoide: 16000
  criatura: 16000
  criatura_quadrupede: 16000
  criatura_alada: 16000
  montaria: 16000
  modulo_cenario: 16000
  mapa_setor: 120000

orcamento_cena:
  capacidade_referencia_tris: 500000
  fator_alvo: 0.80
  triangulos_cena_max: 400000
  draw_calls_cena_max: 400
  vram_texturas_mb_max: 200
