# Perfil de export — Roblox (R15 / blocky)
# Consumido por forge3d (P2). Toda linha marcada [verificar] depende de teste real no Studio (U1-U4).
schema: forge3d/profile@1
perfil: roblox-r15
versao: 2

formato: [glb, rbxlx]

unidades:
  # D62: a geracao mede em metros; a exportacao multiplica a escala final por `escala_saida`.
  escala_saida: 3.5714           # [medido 11/11/2026] 1/0,28: o importador do Studio usa
                                 # 1 unidade glTF = 1 stud, entao o glb sai em studs
  metros_por_unidade: 0.28       # unidade do arquivo exportado (glb em studs); vai ao
                                 # manifest@2 em unidades_export e e o reciproco de escala_saida
  metros_por_stud: 0.28          # [medido 11/11/2026] regua do .rbxlx (16 Parts; extensao
                                 # vertical de 6,6071 studs, igual ao package — D68)
  arredondar_studs: 0.001

eixos:
  up: "+Y"
  frente: "-Z"

aplicar_transforms: true         # MeshPart com escala aplicada quebra Motor6D

pivot:
  prop_estatico: base
  prop_equipavel: empunhadura
  personagem_humanoide: base    # objeto na base; membros usam os 16 bone heads R15 (D47)
  criatura: junta
  modulo_cenario: base
  mapa_setor: centro

colisao:
  modo: hull_por_parte
  max_partes: 15
  uma_por_parte: true            # [verificar] U2: colisor separado nao vem como tal

lod:
  habilitado: false              # Roblox tem RenderFidelity proprio

rig:
  esqueleto_padrao: "r15@1"
  max_ossos: 24
  raiz: HumanoidRootPart
  # D66: retarget da animacao base — osso semantico -> nome da parte R15.
  retarget:
    "r15@1":
      tronco: UpperTorso
      coluna: LowerTorso
      cabeca: Head
      braco_e: LeftUpperArm
      braco_d: RightUpperArm
      antebraco_e: LeftLowerArm
      antebraco_d: RightLowerArm
      perna_e: LeftUpperLeg
      perna_d: RightUpperLeg
      canela_e: LeftLowerLeg
      canela_d: RightLowerLeg
  mapas:
    "r15@1":
      - HumanoidRootPart
      - Head
      - UpperTorso
      - LowerTorso
      - LeftUpperArm
      - LeftLowerArm
      - LeftHand
      - RightUpperArm
      - RightLowerArm
      - RightHand
      - LeftUpperLeg
      - LeftLowerLeg
      - LeftFoot
      - RightUpperLeg
      - RightLowerLeg
      - RightFoot

material:
  modelo: texture                # [medido 11/11/2026] U2: glTF nao trouxe SurfaceAppearance;
                                 # o MeshPart importado tem so TextureID
  textura_max: 1024
  pot: true
  filtro: linear                 # pixel art na Roblox e limitada; nao prometer nearest

validacao:
  escala_delta_pct: 1.0          # arredondamento de stud tolera mais
  pivo_delta_mm: 2.0
  materiais_max: 1
  bytes_max_kb: 4096
  nao_manifold_max: 0
  faces_degeneradas_max: 0
  partes_max: 15
  triangulos_por_parte_max: 10000

orcamento_triangulos:
  prop_estatico: 1500
  prop_equipavel: 800
  personagem_humanoide: 6000
  criatura: 6000
  modulo_cenario: 2000
  mapa_setor: 20000
