[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge3d"
version = "0.6.1"
description = "Esteira de assets 3D por demanda: lote declarativo -> GLB verificado. Independente de projeto."
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6.0,<7",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
forge3d = "forge3d.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge3d"]

# schemas/ e profiles/ sao fonte de verdade na raiz do repo E dados do pacote:
# uma copia entra no wheel para o utilitario funcionar instalado, sem o repo.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "forge3d/data/schemas"
"profiles" = "forge3d/data/profiles"
"blender" = "forge3d/data/blender"
"addons" = "forge3d/data/addons"
"tools" = "forge3d/data/tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "blender: exige o binario do Blender 4.2",
  "godot: exige o binario do Godot 4 em headless",
  "lento: execucao de ponta a ponta, varios segundos",
  "rapido: ciclo completo em um asset, alvo < 30 s",
  "gpu: exige GPU/CUDA e modelos baixados",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
